<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学海灯塔 · 错题本</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
<style>
  :root {
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --primary-soft: #eef2ff;
  }
  body { font-family: 'Noto Sans SC', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

  /* === 3D 翻转卡片 === */
  .flip-card { perspective: 1000px; min-height: 400px; height: 400px; }
  .flip-card-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
  }
  .flip-card-inner.flipped { transform: rotateY(180deg); }
  .flip-card-front, .flip-card-back {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    border-radius: 0.75rem; transform-style: preserve-3d; overflow: hidden;
  }
  .flip-card-front { z-index: 2; transform: rotateY(0deg); }
  .flip-card-back { transform: rotateY(180deg); z-index: 1; }
  .flip-card-inner.flipped .flip-card-front { pointer-events: none !important; z-index: 1 !important; visibility: hidden; }
  .flip-card-inner.flipped .flip-card-back { pointer-events: auto !important; z-index: 10 !important; visibility: visible; }
  .flip-card-inner:not(.flipped) .flip-card-back { pointer-events: none !important; visibility: hidden; }
  .flip-card-inner:not(.flipped) .flip-card-front { pointer-events: auto !important; visibility: visible; }

  /* === 卡片瀑布流 === */
  .card-grid { display: grid; gap: 1rem; grid-template-columns: 1fr; }
  @media (min-width: 768px) { .card-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1024px) { .card-grid { grid-template-columns: repeat(3, 1fr); } }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 3px; }

  /* === A4 双栏打印 === */
  .print-only { display: none; }
  @media print {
    .no-print { display: none !important; }
    .print-only { display: block; }
    body { background: white !important; }
  }
  .paper-header { text-align: center; margin-bottom: 1rem; }
  .paper-meta { display: flex; justify-content: space-around; margin-top: 0.5rem; font-size: 14px; }
  .paper-questions { column-count: 2; column-rule: 1px dashed #94a3b8; column-gap: 1.5rem; }
  .paper-question {
    break-inside: avoid; page-break-inside: avoid;
    margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px dashed #cbd5e1;
  }
  .paper-question-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; font-size: 14px; }
  .paper-img { max-width: 100%; border: 1px solid #e2e8f0; border-radius: 4px; margin: 0.25rem 0; }
  .paper-text { font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  .paper-answer-area {
    margin-top: 0.75rem; padding-top: 0.5rem; border-top: 1px dashed #94a3b8;
    min-height: 4rem; font-size: 14px; color: #94a3b8;
  }
  .paper-appendix { break-before: page; page-break-before: always; }
  .paper-appendix-title {
    font-size: 18px; font-weight: bold; margin-bottom: 0.75rem;
    padding-bottom: 0.25rem; border-bottom: 2px solid #1e293b;
  }
  .paper-answer {
    margin-bottom: 0.75rem; padding-bottom: 0.5rem;
    border-bottom: 1px dashed #cbd5e1; break-inside: avoid; page-break-inside: avoid;
  }

  /* === 自定义 Tailwind 颜色（CSS 变量绑定） === */
  .bg-primary { background-color: var(--primary); }
  .bg-primary-dark { background-color: var(--primary-dark); }
  .bg-primary-soft { background-color: var(--primary-soft); }
  .text-primary { color: var(--primary); }
  .text-primary-dark { color: var(--primary-dark); }
  .border-primary { border-color: var(--primary); }
  .hover\:bg-primary-dark:hover { background-color: var(--primary-dark); }
  .accent-primary { accent-color: var(--primary); }
</style>
</head>
<body class="bg-slate-50 min-h-screen">

<!-- 顶部导航 -->
<header class="no-print bg-white border-b border-slate-200 sticky top-0 z-10">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-4 flex-wrap">
    <h1 class="text-lg font-bold text-primary-dark">学海灯塔 · 错题本</h1>
    <nav class="flex gap-1 flex-wrap">
      <button data-tab="library"  class="tab-btn px-3 py-1.5 text-sm rounded">错题库</button>
      <button data-tab="create"   class="tab-btn px-3 py-1.5 text-sm rounded">录入错题</button>
      <button data-tab="paper"    class="tab-btn px-3 py-1.5 text-sm rounded">重练组卷 <span id="basketBadge" class="ml-1 text-xs px-1.5 py-0.5 bg-rose-500 text-white rounded-full hidden"></span></button>
      <button data-tab="settings" class="tab-btn px-3 py-1.5 text-sm rounded">设置</button>
    </nav>
  </div>
</header>

<main class="no-print max-w-6xl mx-auto px-4 py-6">

  <!-- 错题库视图 -->
  <section id="view-library" class="space-y-4">
    <div id="stats" class="grid grid-cols-4 gap-2"></div>
    <div class="flex flex-wrap items-center gap-2 text-sm">
      <span class="text-slate-600">筛选：</span>
      <select id="filterStatus" class="border border-slate-200 rounded px-2 py-1">
        <option value="ALL">全部状态</option>
        <option value="PENDING">⚠️ 待攻克</option>
        <option value="PROGRESS">🚀 攻克中</option>
        <option value="MASTERED">👏 已掌握</option>
      </select>
      <select id="filterSubject" class="border border-slate-200 rounded px-2 py-1">
        <option value="ALL">全部学科</option>
      </select>
      <button id="addFiltered" class="ml-auto px-2 py-1 text-xs bg-primary-soft text-primary-dark rounded hover:bg-primary hover:text-white">
        筛选结果加入组卷篮
      </button>
    </div>
    <div id="cardGrid" class="card-grid"></div>
    <div id="emptyHint" class="text-center py-12 hidden">
      <div class="text-slate-500 mb-4">还没有错题，开始录入第一道吧</div>
      <button onclick="switchTab('create')" class="px-4 py-2 bg-primary text-white rounded hover:bg-primary-dark">录入错题</button>
    </div>

  <!-- 录入视图 -->
  <section id="view-create" class="space-y-4 hidden">
    <h2 class="text-xl font-semibold">录入错题</h2>
    <p class="text-sm text-slate-500">
      支持 Ctrl+V 直接粘贴剪贴板截图。图片会自动压缩（最大宽度 1000px，JPEG 0.75 质量）后存入本地 IndexedDB。
    </p>
    <form id="mistakeForm" class="max-w-2xl mx-auto space-y-4">
      <div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-lg p-6 text-center cursor-pointer hover:border-primary">
        <div id="dropHint" class="text-slate-500 text-sm">在此区域 Ctrl+V 粘贴截图，或点击选择文件</div>
        <img id="previewImg" class="max-h-48 mx-auto rounded hidden" />
        <input id="fileInput" type="file" accept="image/*" class="hidden" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <label class="text-sm">
          <span class="block text-slate-600 mb-1">学科</span>
          <select id="fSubject" class="w-full border border-slate-200 rounded px-2 py-1.5"></select>
        </label>
        <label class="text-sm">
          <span class="block text-slate-600 mb-1">题目来源</span>
          <input id="fSource" type="text" placeholder="如：期中卷第 18 题" class="w-full border border-slate-200 rounded px-2 py-1.5" />
        </label>
      </div>
      <div class="text-sm">
        <span class="block text-slate-600 mb-1">难度星级</span>
        <div id="difficultyPicker" class="flex gap-1"></div>
      </div>
      <div class="text-sm">
        <span class="block text-slate-600 mb-1">错因分类（多选）</span>
        <div id="reasonPicker" class="flex flex-wrap gap-1"></div>
      </div>
      <label class="text-sm block">
        <span class="block text-slate-600 mb-1">题干（支持纯文本）</span>
        <textarea id="fQuestion" rows="3" class="w-full border border-slate-200 rounded px-2 py-1.5" placeholder="可填写题干文字；如有截图可只粘贴图片"></textarea>
      </label>
      <label class="text-sm block">
        <span class="block text-slate-600 mb-1">孩子反思点</span>
        <textarea id="fReflection" rows="2" class="w-full border border-slate-200 rounded px-2 py-1.5" placeholder="当时为什么错、漏看了什么"></textarea>
      </label>
      <label class="text-sm block">
        <span class="block text-slate-600 mb-1">正确答案与解析（隐藏在卡片背面）</span>
        <textarea id="fAnalysis" rows="3" class="w-full border border-slate-200 rounded px-2 py-1.5"></textarea>
      </label>
      <div id="formError" class="text-rose-600 text-sm hidden"></div>
      <div class="flex gap-2">
        <button type="submit" class="px-4 py-2 bg-primary text-white rounded hover:bg-primary-dark">保存错题</button>
        <button type="button" onclick="switchTab('library')" class="px-4 py-2 bg-slate-100 text-slate-700 rounded hover:bg-slate-200">取消</button>
      </div>
    </form>
  </section>

  <!-- 组卷视图 -->
  <section id="view-paper" class="space-y-4 hidden">
    <h2 class="text-xl font-semibold no-print">组卷重练</h2>
    <div id="paperEmpty" class="text-center py-12 text-slate-500">
      组卷篮为空。请在错题库中勾选"组卷"，或批量加入筛选结果。
    </div>

        <span id="paperCount" class="text-sm text-slate-600"></span>
        <div class="flex gap-2">
          <button onclick="window.print()" class="px-3 py-1.5 text-sm bg-primary text-white rounded hover:bg-primary-dark">打印试卷</button>
          <button onclick="clearBasket()" class="px-3 py-1.5 text-sm bg-slate-100 text-slate-700 rounded hover:bg-slate-200">清空组卷篮</button>
        </div>
      </div>
      <div id="printArea" class="print-area"></div>
    </div>
  </section>

  <!-- 设置视图 -->
  <section id="view-settings" class="space-y-4 hidden">
    <h2 class="text-xl font-semibold">设置中心</h2>
    <div class="max-w-2xl mx-auto space-y-6">
      <section>
        <h3 class="text-lg font-semibold mb-3">主题配色</h3>
        <div id="themeGrid" class="grid grid-cols-2 md:grid-cols-3 gap-2"></div>
      </section>
      <section>
        <h3 class="text-lg font-semibold mb-3">数据备份与恢复</h3>
        <div class="text-sm text-slate-600 mb-3">当前共 <strong id="totalCount">0</strong> 条错题 · IndexedDB 本地存储</div>
        <div class="flex flex-wrap gap-2">
          <button onclick="exportBackup()" class="px-3 py-1.5 text-sm bg-primary text-white rounded hover:bg-primary-dark">导出备份</button>
          <button onclick="document.getElementById('importFile').click()" class="px-3 py-1.5 text-sm bg-slate-100 text-slate-700 rounded hover:bg-slate-200">导入备份</button>
          <input id="importFile" type="file" accept="application/json,.json" class="hidden" onchange="importBackup(event)" />
          <button onclick="clearAllData()" class="px-3 py-1.5 text-sm bg-rose-50 text-rose-600 rounded hover:bg-rose-100">清空所有错题</button>
        </div>
        <div id="settingsMsg" class="mt-2 text-sm hidden"></div>
      </section>
      <section class="text-xs text-slate-400">版本：v2.1.0 (Standalone) · 数据完全本地 · 断网可用</section>
    </div>
  </section>
</main>

<!-- 打印区域（仅打印时显示） -->
<div id="printOnlyArea" class="print-only"></div>

<script>
// ============================================================
// 错题本单文件 HTML（基于 v1.md 规格实现）
// F1 录入 / F2 3D翻转 / F3 A4双栏打印 / F4 5套主题+JSON备份
// ============================================================

// === 常量 ===
const SUBJECTS = ['数学','语文','英语','物理','化学','生物','历史','地理','道法/政治','其他'];
const REASONS = ['概念不清','审题粗心','计算失误','思路堵塞','新颖题型','公式混淆'];
const STATUS_META = {
  PENDING:  { label: '待攻克', emoji: '⚠️' },
  PROGRESS: { label: '攻克中', emoji: '🚀' },
  MASTERED: { label: '已掌握', emoji: '👏' },
};
const THEMES = {
  indigo: { label: '经典靛蓝', primary: '#4f46e5', primaryDark: '#4338ca', soft: '#eef2ff' },
  forest: { label: '森林草绿', primary: '#059669', primaryDark: '#047857', soft: '#ecfdf5' },
  sunset: { label: '晚霞暖杏', primary: '#ea580c', primaryDark: '#c2410c', soft: '#fff7ed' },
  sky:    { label: '晴空碧海', primary: '#0284c7', primaryDark: '#0369a1', soft: '#f0f9ff' },
  violet: { label: '优雅紫罗兰', primary: '#7c3aed', primaryDark: '#6d28d9', soft: '#f5f3ff' },
};
const DB_NAME = 'ChildMistakeBookDB';
const DB_VERSION = 1;
const STORE_NAME = 'mistakes';
const BACKUP_VERSION = '2.1.0';
const THEME_KEY = 'mistake-book:theme';

// === 状态 ===
let state = {
  mistakes: [],
  basket: new Set(),
  filterStatus: 'ALL',
  filterSubject: 'ALL',
  formDifficulty: 3,
  formReasons: [],
  formImageData: '',
  theme: 'indigo',
};

// === IndexedDB ===
let dbPromise = null;
function getDB() {
  return new Promise((resolve, reject) => {
    if (dbPromise) return resolve(dbPromise);
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        store.createIndex('subject', 'subject');
        store.createIndex('status', 'status');
        store.createIndex('createdAt', 'createdAt');
      }
    };
    req.onsuccess = (e) => { dbPromise = e.target.result; resolve(dbPromise); };
    req.onerror = (e) => reject(e.target.error);
  });
}
async function dbGetAll() {
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbPut(item) {
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(item);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbDelete(id) {
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbClear() {
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// === 图片压缩管道 ===
const MAX_WIDTH = 1000;
const JPEG_QUALITY = 0.75;
const MAX_INPUT_BYTES = 10 * 1024 * 1024;

async function compressImage(file) {
  if (file.size > MAX_INPUT_BYTES) throw new Error('图片过大（超过 10MB），请压缩后再粘贴');
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const ratio = Math.min(1, MAX_WIDTH / img.naturalWidth);
      const w = Math.round(img.naturalWidth * ratio);
      const h = Math.round(img.naturalHeight * ratio);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      if (!ctx) return reject(new Error('Canvas 2D 上下文不可用'));
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(img.src);
      resolve(canvas.toDataURL('image/jpeg', JPEG_QUALITY));
    };
    img.onerror = () => reject(new Error('图片加载失败'));
    img.src = URL.createObjectURL(file);
  });
}

function extractImageFromClipboard(e) {
  const items = e.clipboardData?.items;
  if (!items) return null;
  for (let i = 0; i < items.length; i++) {
    if (items[i].type.startsWith('image/')) return items[i].getAsFile();
  }
  return null;
}

// === 初始化 ===
async function init() {
  loadTheme();
  renderSubjectFilter();
  renderSubjectPicker();
  renderDifficultyPicker();
  renderReasonPicker();
  renderThemeGrid();
  bindEvents();
  await refreshMistakes();
  switchTab('library');
}

function loadTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  state.theme = (saved && saved in THEMES) ? saved : 'indigo';
  applyTheme(state.theme);
}
function applyTheme(id) {
  const m = THEMES[id];
  document.documentElement.style.setProperty('--primary', m.primary);
  document.documentElement.style.setProperty('--primary-dark', m.primaryDark);
  document.documentElement.style.setProperty('--primary-soft', m.soft);
  localStorage.setItem(THEME_KEY, id);
  state.theme = id;
  renderThemeGrid();
}

function renderSubjectFilter() {
  const sel = document.getElementById('filterSubject');
  SUBJECTS.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
}
function renderSubjectPicker() {
  const sel = document.getElementById('fSubject');
  SUBJECTS.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
}
function renderDifficultyPicker() {
  const wrap = document.getElementById('difficultyPicker');
  wrap.innerHTML = '';
  for (let n = 1; n <= 5; n++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'text-xl ' + (n <= state.formDifficulty ? 'text-amber-500' : 'text-slate-300');
    btn.textContent = '★';
    btn.onclick = () => {
      state.formDifficulty = n;
      renderDifficultyPicker();
    };
    wrap.appendChild(btn);
  }
}
function renderReasonPicker() {
  const wrap = document.getElementById('reasonPicker');
  wrap.innerHTML = '';
  REASONS.forEach(r => {
    const btn = document.createElement('button');
    btn.type = 'button';
    const active = state.formReasons.includes(r);
    btn.className = 'text-xs px-2 py-1 rounded ' + (active ? 'bg-primary text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200');
    btn.textContent = r;
    btn.onclick = () => {
      if (state.formReasons.includes(r)) {
        state.formReasons = state.formReasons.filter(x => x !== r);
      } else {
        state.formReasons.push(r);
      }
      renderReasonPicker();
    };
    wrap.appendChild(btn);
  });
}
function renderThemeGrid() {
  const grid = document.getElementById('themeGrid');
  grid.innerHTML = '';
  Object.entries(THEMES).forEach(([id, meta]) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    const selected = id === state.theme;
    btn.className = 'p-3 rounded border-2 text-left transition ' + (selected ? 'border-primary' : 'border-slate-200 hover:border-slate-300');
    btn.innerHTML = `
      <div class="flex items-center gap-2 mb-1">
        <span class="w-4 h-4 rounded" style="background:${meta.primary}"></span>
        <span class="text-sm font-medium">${meta.label}</span>
      </div>
      <div class="text-xs text-slate-500">点击切换</div>
    `;
    btn.onclick = () => applyTheme(id);
    grid.appendChild(btn);
  });
}

// === 事件绑定 ===
function bindEvents() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => switchTab(btn.dataset.tab);
  });

  // 录入表单
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      state.formImageData = await compressImage(file);
      showPreview();
    } catch (err) {
      showFormError(err.message || '图片处理失败');
    }
  });
  document.addEventListener('paste', async (e) => {
    if (document.getElementById('view-create').classList.contains('hidden')) return;
    const blob = extractImageFromClipboard(e);
    if (!blob) return;
    try {
      state.formImageData = await compressImage(blob);
      showPreview();
    } catch (err) {
      showFormError(err.message || '图片处理失败');
    }
  });

  document.getElementById('mistakeForm').addEventListener('submit', handleSubmit);

  // 筛选
  document.getElementById('filterStatus').addEventListener('change', (e) => {
    state.filterStatus = e.target.value;
    renderLibrary();
  });
  document.getElementById('filterSubject').addEventListener('change', (e) => {
    state.filterSubject = e.target.value;
    renderLibrary();
  });
  document.getElementById('addFiltered').addEventListener('click', () => {
    const ids = getFilteredMistakes().map(m => m.id);
    ids.forEach(id => state.basket.add(id));
    updateBasketBadge();
    renderLibrary();
  });
}

function showPreview() {
  const img = document.getElementById('previewImg');
  const hint = document.getElementById('dropHint');
  if (state.formImageData) {
    img.src = state.formImageData;
    img.classList.remove('hidden');
    hint.textContent = '已粘贴图片，可重新粘贴替换';
  } else {
    img.classList.add('hidden');
    hint.textContent = '在此区域 Ctrl+V 粘贴截图，或点击选择文件';
  }
}

function showFormError(msg) {
  const el = document.getElementById('formError');
  el.textContent = msg;
  el.classList.remove('hidden');
}

async function handleSubmit(e) {
  e.preventDefault();
  const subject = document.getElementById('fSubject').value;
  const source = document.getElementById('fSource').value.trim();
  const questionText = document.getElementById('fQuestion').value.trim();
  const reflection = document.getElementById('fReflection').value.trim();
  const analysis = document.getElementById('fAnalysis').value.trim();
  if (!questionText && !state.formImageData) {
    showFormError('请至少填写题干或粘贴一张图片');
    return;
  }
  const item = {
    id: `mistake_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
    subject, source,
    difficulty: state.formDifficulty,
    reasons: [...state.formReasons],
    questionText, reflection, analysis,
    status: 'PENDING',
    createdAt: Date.now(),
    reviewCount: 0,
    imageData: state.formImageData || undefined,
  };
  await dbPut(item);
  // 重置表单
  document.getElementById('mistakeForm').reset();
  state.formDifficulty = 3;
  state.formReasons = [];
  state.formImageData = '';
  renderDifficultyPicker();
  renderReasonPicker();
  showPreview();
  document.getElementById('formError').classList.add('hidden');
  await refreshMistakes();
  switchTab('library');
}

// === 视图切换 ===
function switchTab(tab) {
  ['library', 'create', 'paper', 'settings'].forEach(t => {
    document.getElementById('view-' + t).classList.toggle('hidden', t !== tab);
  });
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const active = btn.dataset.tab === tab;
    btn.className = 'tab-btn px-3 py-1.5 text-sm rounded ' + (active ? 'bg-primary text-white' : 'text-slate-600 hover:bg-slate-100');
  });
  if (tab === 'settings') updateTotalCount();
  if (tab === 'paper') renderPaper();
}

// === 错题库 ===
async function refreshMistakes() {
  state.mistakes = await dbGetAll();
  state.mistakes.sort((a, b) => b.createdAt - a.createdAt);
  renderLibrary();
  updateTotalCount();
}

function getFilteredMistakes() {
  return state.mistakes.filter(m => {
    if (state.filterStatus !== 'ALL' && m.status !== state.filterStatus) return false;
    if (state.filterSubject !== 'ALL' && m.subject !== state.filterSubject) return false;
    return true;
  });
}

function renderLibrary() {
  const stats = {
    total: state.mistakes.length,
    pending: state.mistakes.filter(m => m.status === 'PENDING').length,
    progress: state.mistakes.filter(m => m.status === 'PROGRESS').length,
    mastered: state.mistakes.filter(m => m.status === 'MASTERED').length,
  };
  const statsEl = document.getElementById('stats');
  statsEl.innerHTML = '';
  [
    { label: '总数', value: stats.total, tone: 'slate' },
    { label: '待攻克', value: stats.pending, tone: 'amber' },
    { label: '攻克中', value: stats.progress, tone: 'blue' },
    { label: '已掌握', value: stats.mastered, tone: 'green' },
  ].forEach(s => {
    const toneClass = {
      slate: 'bg-slate-50 text-slate-700',
      amber: 'bg-amber-50 text-amber-700',
      blue:  'bg-blue-50 text-blue-700',
      green: 'bg-green-50 text-green-700',
    }[s.tone];
    const div = document.createElement('div');
    div.className = `rounded p-3 text-center ${toneClass}`;
    div.innerHTML = `<div class="text-2xl font-bold">${s.value}</div><div class="text-xs">${s.label}</div>`;
    statsEl.appendChild(div);
  });

  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  const empty = document.getElementById('emptyHint');
  if (state.mistakes.length === 0) {
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  const filtered = getFilteredMistakes();
  filtered.forEach(m => grid.appendChild(renderCard(m)));
  if (filtered.length === 0) {
    const tip = document.createElement('div');
    tip.className = 'col-span-full text-center py-8 text-slate-500';
    tip.textContent = '无符合条件的错题';
    grid.appendChild(tip);
  }
}

function renderCard(m) {
  const meta = STATUS_META[m.status];
  const wrapper = document.createElement('div');
  wrapper.className = 'flip-card';
  wrapper.tabIndex = 0;
  const statusBadge = {
    PENDING: 'bg-amber-100 text-amber-700',
    PROGRESS: 'bg-blue-100 text-blue-700',
    MASTERED: 'bg-green-100 text-green-700',
  }[m.status];
  wrapper.innerHTML = `
    <div class="flip-card-inner">
      <div class="flip-card-front bg-white border border-slate-200 shadow-sm p-5 flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <span class="text-xs font-medium px-2 py-0.5 rounded bg-slate-100 text-slate-700">${m.subject}</span>
              <span class="text-xs text-amber-500">${'★'.repeat(m.difficulty)}${'☆'.repeat(5-m.difficulty)}</span>
            </div>
            <span class="text-xs px-2 py-0.5 rounded ${statusBadge}">${meta.emoji} ${meta.label}</span>
          </div>
          ${m.source ? `<div class="text-xs text-slate-500 mb-2">来源：${escapeHTML(m.source)}</div>` : ''}
          ${m.reasons.length ? `<div class="flex flex-wrap gap-1 mb-2">${m.reasons.map(r => `<span class="text-xs px-1.5 py-0.5 bg-rose-50 text-rose-600 rounded">${r}</span>`).join('')}</div>` : ''}
          ${m.imageData ? `<img src="${m.imageData}" alt="题干" class="w-full mb-2 rounded border border-slate-100" />` : ''}
          ${m.questionText ? `<div class="text-sm text-slate-700 whitespace-pre-wrap">${escapeHTML(m.questionText)}</div>` : ''}
          ${m.reflection ? `<div class="mt-2 text-xs text-slate-500 italic">反思：${escapeHTML(m.reflection)}</div>` : ''}
        </div>
        <div class="flex items-center justify-between mt-3 pt-3 border-t border-slate-100">
          <label class="text-xs flex items-center gap-1 cursor-pointer">
            <input type="checkbox" ${state.basket.has(m.id) ? 'checked' : ''} class="accent-primary" />
            组卷
          </label>
          <button type="button" class="text-xs px-3 py-1 rounded bg-primary text-white hover:bg-primary-dark">翻转看答案</button>
        </div>
      </div>
      <div class="flip-card-back bg-gradient-to-b from-slate-900 to-slate-800 text-white shadow-xl p-5 flex flex-col justify-between">
        <div>
          <div class="text-xs text-slate-300 mb-2">标准答案与解析</div>
          <div class="text-sm whitespace-pre-wrap">${escapeHTML(m.analysis || '（暂无解析）')}</div>
          <div class="mt-3 text-xs text-slate-400">已复习 ${m.reviewCount} 次 · 录入于 ${new Date(m.createdAt).toLocaleDateString()}</div>
        </div>
        <div class="flex flex-col gap-2 mt-3 pt-3 border-t border-slate-700">
          <button type="button" class="text-xs px-3 py-1 rounded bg-slate-700 hover:bg-slate-600">翻回题目</button>
          <div class="flex gap-1">
            ${['PENDING','PROGRESS','MASTERED'].map(s => `
              <button type="button" data-status="${s}" class="flex-1 text-xs px-2 py-1 rounded ${m.status === s ? 'bg-primary text-white' : 'bg-slate-700 text-slate-200 hover:bg-slate-600'}">
                ${STATUS_META[s].emoji} ${STATUS_META[s].label}
              </button>
            `).join('')}
          </div>
          <button type="button" class="text-xs text-rose-300 hover:text-rose-200">删除此题</button>
        </div>
      </div>
    </div>
  `;
  // 事件
  const inner = wrapper.querySelector('.flip-card-inner');
  const flipToFrontBtn = wrapper.querySelector('.flip-card-back button');
  const flipToBackBtn = wrapper.querySelector('.flip-card-front button');
  const checkbox = wrapper.querySelector('input[type=checkbox]');
  const deleteBtn = wrapper.querySelector('.flip-card-back .text-rose-300');

  flipToBackBtn.onclick = () => inner.classList.add('flipped');
  flipToFrontBtn.onclick = () => inner.classList.remove('flipped');
  checkbox.addEventListener('change', () => {
    if (checkbox.checked) state.basket.add(m.id);
    else state.basket.delete(m.id);
    updateBasketBadge();
  });
  wrapper.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      inner.classList.toggle('flipped');
    }
  });
  wrapper.querySelectorAll('[data-status]').forEach(btn => {
    btn.onclick = async () => {
      const s = btn.dataset.status;
      m.status = s;
      m.reviewCount += 1;
      await dbPut(m);
      await refreshMistakes();
    };
  });
  deleteBtn.onclick = async () => {
    if (!window.confirm('确定删除此错题？')) return;
    await dbDelete(m.id);
    state.basket.delete(m.id);
    await refreshMistakes();
    updateBasketBadge();
  };
  return wrapper;
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function updateBasketBadge() {
  const badge = document.getElementById('basketBadge');
  if (state.basket.size > 0) {
    badge.textContent = state.basket.size;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

// === 组卷 ===
function renderPaper() {
  const empty = document.getElementById('paperEmpty');
  const content = document.getElementById('paperContent');
  const mistakes = state.mistakes.filter(m => state.basket.has(m.id));
  if (mistakes.length === 0) {
    empty.classList.remove('hidden');
    content.classList.add('hidden');
    return;
  }
  empty.classList.add('hidden');
  content.classList.remove('hidden');
  document.getElementById('paperCount').textContent = `组卷篮共 ${mistakes.length} 道题`;
  document.getElementById('printArea').innerHTML = renderPaperHTML(mistakes);
  // 同步到打印区域
  document.getElementById('printOnlyArea').innerHTML = renderPaperHTML(mistakes);
}

function renderPaperHTML(mistakes) {
  return `
    <header class="paper-header">
      <h1 class="text-2xl font-bold text-center">错题重练试卷</h1>
      <div class="paper-meta">
        <span>姓名：____________</span>
        <span>学号：____________</span>
        <span>日期：____________</span>
        <span>得分：____________</span>
      </div>
      <hr class="my-2 border-slate-400" />
    </header>
    <div class="paper-questions">
      ${mistakes.map((m, idx) => `
        <article class="paper-question">
          <div class="paper-question-head">
            <span class="font-bold">${idx + 1}. [${m.subject}]</span>
            <span class="text-xs text-slate-500">${'★'.repeat(m.difficulty)}</span>
            <span class="text-xs text-slate-500">${escapeHTML(m.source || '')}</span>
          </div>
          ${m.imageData ? `<img src="${m.imageData}" alt="第 ${idx+1} 题图" class="paper-img" />` : ''}
          ${m.questionText ? `<div class="paper-text">${escapeHTML(m.questionText)}</div>` : ''}
          <div class="paper-answer-area">解答：</div>
        </article>
      `).join('')}
    </div>
    <section class="paper-appendix">
      <h2 class="paper-appendix-title">参考答案与错因警示</h2>
      ${mistakes.map((m, idx) => `
        <article class="paper-answer">
          <div class="font-bold">第 ${idx+1} 题 答案：</div>
          <div class="paper-text">${escapeHTML(m.analysis || '（暂无解析）')}</div>
          ${m.reasons.length ? `<div class="text-xs text-rose-700 mt-1">⚠️ 错因警示：${m.reasons.join('、')}</div>` : ''}
          ${m.reflection ? `<div class="text-xs text-slate-600 italic mt-1">反思：${escapeHTML(m.reflection)}</div>` : ''}
        </article>
      `).join('')}
    </section>
  `;
}

function clearBasket() {
  state.basket.clear();
  updateBasketBadge();
  renderLibrary();
  renderPaper();
}

// === 设置：备份 ===
function updateTotalCount() {
  document.getElementById('totalCount').textContent = state.mistakes.length;
}

async function exportBackup() {
  showSettingsMsg('正在导出…', 'info');
  try {
    const pkg = { version: BACKUP_VERSION, exportedAt: Date.now(), mistakes: state.mistakes };
    const blob = new Blob([JSON.stringify(pkg, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `错题本备份-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showSettingsMsg(`已导出 ${pkg.mistakes.length} 条错题`, 'success');
  } catch (err) {
    showSettingsMsg(err.message || '导出失败', 'error');
  }
}

async function importBackup(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  showSettingsMsg('正在导入…', 'info');
  try {
    const text = await file.text();
    const pkg = JSON.parse(text);
    if (!pkg.version || !Array.isArray(pkg.mistakes)) throw new Error('备份文件结构不正确');
    let imported = 0, skipped = 0;
    const existingIds = new Set(state.mistakes.map(m => m.id));
    for (const item of pkg.mistakes) {
      if (!isValidMistake(item)) { skipped++; continue; }
      if (existingIds.has(item.id)) { skipped++; continue; }
      await dbPut(item);
      imported++;
    }
    await refreshMistakes();
    showSettingsMsg(`已导入 ${imported} 条，跳过 ${skipped} 条（重复或格式错误）`, 'success');
  } catch (err) {
    showSettingsMsg(err.message || '导入失败', 'error');
  }
  e.target.value = '';
}

function isValidMistake(item) {
  if (typeof item !== 'object' || item === null) return false;
  return typeof item.id === 'string'
    && typeof item.subject === 'string'
    && typeof item.createdAt === 'number'
    && Array.isArray(item.reasons)
    && (item.status === 'PENDING' || item.status === 'PROGRESS' || item.status === 'MASTERED');
}

async function clearAllData() {
  if (!window.confirm('确定清空所有错题？此操作不可撤销，请先导出备份。')) return;
  showSettingsMsg('正在清空…', 'info');
  try {
    await dbClear();
    state.basket.clear();
    await refreshMistakes();
    updateBasketBadge();
    showSettingsMsg('已清空所有错题', 'success');
  } catch (err) {
    showSettingsMsg(err.message || '清空失败', 'error');
  }
}

function showSettingsMsg(msg, kind) {
  const el = document.getElementById('settingsMsg');
  el.textContent = msg;
  el.className = 'mt-2 text-sm ' + ({ success: 'text-green-600', error: 'text-rose-600', info: 'text-slate-600' }[kind] || 'text-slate-600');
  el.classList.remove('hidden');
}

// === 启动 ===
init();
</script>
